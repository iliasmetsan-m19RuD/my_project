{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — Складской учёт</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <header class="header">
        <div class="header-top">
            <span class="header-title">Складской учёт</span>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Авторизация</h1>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}

                <div class="form-row">
                    <label class="form-label">Логин:</label>
                    <input type="text" name="username" class="form-input" placeholder="Введите логин" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Пароль:</label>
                    <input type="password" name="password" class="form-input" placeholder="Введите пароль" required>
                </div>

                <div class="form-row form-row-submit">
                    <button type="submit" class="btn btn-primary">Войти</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
